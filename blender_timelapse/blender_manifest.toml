schema_version = "1.0.0"

id = "blender_timelapse"
version = "1.0.0"
name = "Blender Timelapse"
tagline = "Record fixed-camera modelling timelapses while you work freely"
maintainer = "Blender Timelapse contributors"
type = "add-on"

website = "https://github.com/jaredstanbrook/blender-timelapse"

tags = ["Render", "Camera", "Sequencer"]

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Blender Timelapse contributors"]

[permissions]
files = "Save timelapse frames, session info and videos to disk"

[build]
paths_exclude_pattern = ["__pycache__/", "/.git/", "*.zip"]
